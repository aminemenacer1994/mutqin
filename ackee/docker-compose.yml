name: mutqin-ackee

# Isolated Ackee stack (not the Laravel app). Official pattern:
# https://github.com/electerious/Ackee/blob/master/docs/Get%20started.md#with-docker-compose
#
# Local:
#   cp .env.example .env
#   docker compose up -d
#   open http://127.0.0.1:3000
#
# Production HTTPS (VPS with DNS for analytics.mutqin.ai):
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up -d

services:
  ackee:
    image: electerious/ackee:latest
    restart: unless-stopped
    ports:
      - "${ACKEE_HOST_PORT:-3000}:3000"
    environment:
      ACKEE_MONGODB: mongodb://mongo:27017/ackee
      ACKEE_USERNAME: ${ACKEE_USERNAME}
      ACKEE_PASSWORD: ${ACKEE_PASSWORD}
      ACKEE_ALLOW_ORIGIN: ${ACKEE_ALLOW_ORIGIN}
      ACKEE_AUTO_ORIGIN: ${ACKEE_AUTO_ORIGIN:-true}
    depends_on:
      mongo:
        condition: service_started
    networks:
      - ackee

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - ackee_mongo_data:/data/db
    networks:
      - ackee

volumes:
  ackee_mongo_data:

networks:
  ackee:
    driver: bridge
