name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  php-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run PHPUnit
        run: composer test

      - name: Run performance baseline tests
        run: composer test:perf

      - name: Run Qur'an content integrity checks
        run: composer test:quran-integrity

  js-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run core JS tests
        run: npm run test:mutqin

      - name: Run Qur'an content integrity checks
        run: npm run test:quran-integrity

      - name: Run billing utility tests
        run: node tests/js/billing.test.mjs

  build-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Analyze bundle sizes
        run: npm run perf:bundles

      - name: Verify Mix manifest exists
        run: test -f public/mix-manifest.json
